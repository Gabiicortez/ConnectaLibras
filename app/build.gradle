plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.connectalibras'

    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId 'com.connectalibras'
        minSdk 24
        ndk { abiFilters "arm64-v8a", "x86_64" }
        targetSdk 35
        versionCode 6
        versionName '4.2-python311-camera'
    }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:0.10.32'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}

// Python executado dentro do app; instale Python 3.11 no PC para compilar.
chaquopy {
    defaultConfig {
        version = "3.11"
        pip { install "-r", "src/main/python/requirements_android.txt" }
        // Mantém os fontes para facilitar os erros do seu módulo no Logcat.
        pyc { src = false }
    }
}
